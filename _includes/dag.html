<svg class="dag" viewBox="0 0 720 170" role="img" aria-labelledby="dag-title dag-desc" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8863B" />
    </marker>
  </defs>
  <line class="dag-edge" x1="98" y1="60" x2="342" y2="60" marker-end="url(#arrow)" />
  <line class="dag-edge" x1="378" y1="60" x2="622" y2="60" marker-end="url(#arrow)" />

  <circle class="dag-node" cx="80" cy="60" r="8" />
  <circle class="dag-node" cx="360" cy="60" r="8" />
  <circle class="dag-node" cx="640" cy="60" r="8" />

  <text class="dag-label" x="80" y="105" text-anchor="middle">Causal Measurement<tspan x="80" dy="1.3em">&amp; Experimentation</tspan></text>
  <text class="dag-label" x="360" y="105" text-anchor="middle">AI &amp; Decision<tspan x="360" dy="1.3em">Systems</tspan></text>
  <text class="dag-label" x="640" y="105" text-anchor="middle">Predictive<tspan x="640" dy="1.3em">Data Science</tspan></text>
</svg>
